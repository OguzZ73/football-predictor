[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "0.1.0"
description = "Dixon-Coles Poisson model for football score probabilities (educational)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
    "statsmodels>=0.13",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
kaggle = ["kaggle>=1.6"]

[project.scripts]
football-predictor = "football_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
